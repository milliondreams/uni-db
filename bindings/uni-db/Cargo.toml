[package]
name = "uni-python"
description = "Python bindings for Uni graph database"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_uni_db"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
uni-db = { workspace = true, default-features = true, features = ["mimalloc", "pyo3-plugins"] }
uni-locy = { workspace = true }
uni-common = { workspace = true }
uni-store = { workspace = true }
uni-plugin = { workspace = true }
uni-plugin-rhai = { workspace = true }
# Optional WASM loaders — gated by the `wasm-plugins` / `extism-plugins`
# binding features (on by default for the standard wheel). Wheel variants
# that reuse this source without the features compile the wrappers out.
uni-plugin-wasm = { workspace = true, optional = true }
uni-plugin-extism = { workspace = true, optional = true }
# GraphCompute registry backing guest graph algorithms; only needed when a
# WASM/Extism loader is enabled (its `with_graph` argument type lives here).
uni-plugin-builtin = { workspace = true, optional = true }
# M8 F2: enable the live PyO3 plugin loader (decorator surfaces on
# Database / Session). Same workspace pin as uni-plugin-pyo3.
uni-plugin-pyo3 = { workspace = true, features = ["pyo3"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }

[features]
# No WASM loaders by default, matching the variant wheel crates
# (uni-db-onnx / -cuda / -metal), which reuse this source and already ship
# without them. Both loaders route through wasmtime + cranelift (extism pulls
# wasmtime on its own path, so dropping only `wasm-plugins` reclaims nothing)
# — together ~7 MiB of .text for a capability no first-party plugin uses.
# Enable explicitly for a source build: `--features wasm-plugins,extism-plugins`.
# Without them the WASM wrapper methods compile out.
default = []
# Expose `Database.load_wasm_component` to Python (wasmtime Component Model).
wasm-plugins = ["dep:uni-plugin-wasm", "dep:uni-plugin-builtin", "uni-db/wasm-plugins"]
# Expose `Database.load_wasm_extism` to Python (wasmtime + extism).
extism-plugins = ["dep:uni-plugin-extism", "dep:uni-plugin-builtin", "uni-db/extism-plugins"]
