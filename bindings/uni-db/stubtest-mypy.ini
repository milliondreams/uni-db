# Config for the `stubtest` CI step only -- deliberately NOT the project's
# `[tool.mypy] strict = true` in pyproject.toml.
#
# stubtest type-checks the stub with mypy before diffing it against the live
# module, and `uni_db/_retry.py` imports the compiled `uni_db._uni_db`, which
# has no stub of its own. Without this the run dies on `import-not-found`
# before a single drift check executes.
[mypy]
ignore_missing_imports = True
